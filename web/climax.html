<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>⚡ CLIMAX</title>
    <link rel="stylesheet" href="style_v2.css">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600&family=Consolas&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Climax Window Specific overrides to ensure 100% legibility and deep contrast */
        body {
            background-color: #070913 !important;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }
        .notepad-window {
            width: 100vw;
            height: 100vh;
            border-color: #a282f9 !important;
            animation: pulse-beat-dramatic var(--beat-duration, 0.5s) infinite ease-in-out !important;
            background-color: #000000 !important;
        }
        .editor-container {
            background-color: #000000 !important;
        }
        .notepad-textarea {
            color: #ffffff !important;
            font-size: 20px !important;
            font-weight: bold !important;
            text-transform: uppercase !important;
            text-shadow: 0 0 10px rgba(162, 130, 249, 0.8) !important;
            line-height: 1.5 !important;
            padding: 15px !important;
        }
        .cursor {
            color: #a282f9 !important;
        }
    </style>
</head>
<body class="theme-dramatic">
    <div id="notepad-window" class="notepad-window">
        <!-- Minimal Title Bar -->
        <div class="title-bar" style="background-color: #090b16 !important; border-bottom-color: #a282f9 !important; height: 35px;">
            <div class="tabs-container" style="height: 28px;">
                <div class="tab active" style="background-color: #000000 !important; border-color: #a282f9 !important; color: #ffffff !important; height: 26px;">
                    <span class="tab-icon">⚡</span>
                    <span class="tab-title" style="color: #a282f9; font-weight: 600;">Climax.txt</span>
                </div>
            </div>
        </div>
        
        <!-- Editor Content -->
        <div class="editor-container">
            <div class="glitch-overlay" style="display: block;"></div>
            <div class="notepad-textarea" id="notepad-textarea"><span class="lyrics-history" id="lyrics-history"></span><span class="current-word-container" id="current-line-span"></span><span class="cursor" id="cursor">|</span></div>
        </div>
    </div>

    <script src="climax.js"></script>
</body>
</html>

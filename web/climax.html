<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>⚡ CLIMAX</title>
    <link id="main-css" rel="stylesheet" href="style.css?v=5">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0f0f11;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }
        .main-content {
            padding: 40px;
        }
        .lyrics-display {
            justify-content: center;
            align-items: center;
        }
        .lyrics-history {
            position: static;
            margin-bottom: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .current-line {
            font-size: 5vw;
            text-align: center;
        }
    </style>
</head>
<body class="theme-dramatic">
    <!-- Dynamic Ambient Background -->
    <div id="app-background" class="app-background"></div>
    <div id="glass-overlay" class="glass-overlay"></div>

    <div id="app-container" class="app-container" style="width: 100%; height: 100%;">
        <main class="main-content">
            <div class="editor-container" id="editor-container" style="max-width: 100%; border: none; box-shadow: none; background: transparent; backdrop-filter: none;">
                <div class="glitch-overlay" id="glitch-overlay"></div>
                <div class="lyrics-display" id="lyrics-display">
                    <div class="lyrics-history" id="lyrics-history"></div>
                    <div class="current-line climax-text" id="current-line-span"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="climax.js?v=5"></script>
</body>
</html>
